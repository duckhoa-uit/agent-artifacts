name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run types:check
      - run: npm test
      - run: npm run skill:validate
      - run: npm run check
      - run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run e2e
        env:
          ARTIFACTS_URL: ${{ vars.ARTIFACTS_URL }}
          ARTIFACTS_E2E_ACCESS_CLIENT_ID: ${{ secrets.ARTIFACTS_E2E_ACCESS_CLIENT_ID }}
          ARTIFACTS_E2E_ACCESS_CLIENT_SECRET: ${{ secrets.ARTIFACTS_E2E_ACCESS_CLIENT_SECRET }}
